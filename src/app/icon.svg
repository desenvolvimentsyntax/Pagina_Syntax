<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Syntax Sistemas">
  <!--
    Favicon do site. Convenção do App Router: `src/app/icon.svg` vira o
    <link rel="icon"> de todas as páginas, sem configuração.

    É o "S" da marca sobre o quadrado azul — o mesmo tratamento de app-icon
    que a Syntax já usa nos ícones de produto (só sem os quadradinhos
    coloridos, que ali servem para diferenciar FACT/PRO/PREMIUM e aqui não
    têm função). A geometria da fita é a do arquivo oficial, idêntica à que
    o `components/ui/MarcaProduto.tsx` desenha.

    Com fundo sólido de propósito: o símbolo isolado tem fundo transparente e
    a metade de baixo é quase preta, então ela desapareceria numa aba em modo
    escuro. O quadrado azul garante leitura em qualquer tema.

    SVG e não PNG: 1 KB, nítido em 16px e em 512px, e sem arquivo binário
    novo no repositório.
  -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#172B63" />
    </linearGradient>
    <linearGradient id="faceClara" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9DC4F8" />
      <stop offset="1" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="faceMedia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E6BE8" />
      <stop offset="1" stop-color="#123C8F" />
    </linearGradient>
    <linearGradient id="faceEscura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3A55" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="220" fill="url(#fundo)" />

  <g transform="translate(154.5,184.1) scale(2.645)">
    <path d="M60,77 L165,22 A19,19 0 0 1 165,60 L60,115 A19,19 0 0 1 60,77 Z" fill="url(#faceClara)" />
    <path d="M60,77 L165,132 A19,19 0 0 1 165,170 L60,115 A19,19 0 0 1 60,77 Z" fill="url(#faceMedia)" />
    <path d="M165,132 A19,19 0 0 1 165,170 L60,225 A19,19 0 0 1 60,187 Z" fill="url(#faceEscura)" />
  </g>
</svg>
